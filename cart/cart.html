<!-- Bookbang/cart/cart.html

 

cart.html - static/fetch-based cart page for sites that use fetch() to include navbar/footer -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Cart — BookBang</title>
<link rel="stylesheet" href="cart.css">
<link rel="stylesheet" href="../bookbang-theme.css">
<link rel="stylesheet" href="/../navbar.css">
</head>
<body>
<div id="navbar"></div>

<main class="cart-container" id="cart-root">
  <h2>Your Cart</h2>
  <div class="loading">Loading cart...</div>
</main>

<script>
fetch('navbar.php').then(r=>r.text()).then(html=>document.getElementById('navbar').innerHTML=html);

// fetch cart via a small API endpoint we'll create (get_cart.php). If not present, we fallback to session approach.
function loadCart() {
  fetch('get_cart.php').then(r=>{
    if (!r.ok) throw new Error('No API');
    return r.json();
  }).then(data=>{
    renderCart(data);
  }).catch(()=> {
    // fallback: brief message + link to cart.php
    document.getElementById('cart-root').innerHTML = '<div class="empty"><p>Cart not available via ajax on this server. <a href="cart.php">Open cart page</a></p></div>';
  });
}

function renderCart(data) {
  const root = document.getElementById('cart-root');
  if (!data.items || data.items.length === 0) {
    root.innerHTML = '<div class="empty"><p>Your cart is empty.</p><a class="btn" href="ProductPage.php">Continue shopping</a></div>';
    return;
  }
  let html = '<div class="cart-grid"><div class="items">';
  data.items.forEach(it=>{
    html += `<div class="cart-item">
      <div class="thumb"><img src="${it.image}" alt="${it.title}"></div>
      <div class="meta">
        <h4>${it.title}</h4>
        <p class="price">₱${parseFloat(it.price).toFixed(2)} x ${it.qty} = <strong>₱${(it.qty*it.price).toFixed(2)}</strong></p>
        <div class="actions"><a class="small" href="cart.php?action=remove&id=${it.id}">Remove</a> <a class="small" href="productdescription.php?id=${it.book_id}">View</a></div>
      </div>
    </div>`;
  });
  html += `</div><aside class="summary">
    <h3>Order Summary</h3>
    <div class="summary-row"><span>Items</span><span>${data.items.length}</span></div>
    <div class="summary-row total"><span>Total</span><span>₱${parseFloat(data.total).toFixed(2)}</span></div>
    <div class="summary-actions">
      <a class="btn" href="checkout.php">Checkout</a>
      <a class="btn ghost" href="cart.php?action=clear">Clear Cart</a>
    </div>
  </aside></div>`;
  root.innerHTML = html;
}

// try to load cart via API
loadCart();
</script>
<script src="cart.js"></script>
</body>
</html>
